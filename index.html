<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Oakley H2'26</title>
<style>
@font-face{font-family:"Avenir Next";src:url("fonts/Avenir-Next-Regular.woff2") format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:"Avenir Next";src:url("fonts/Avenir-Next-Bold.woff2") format("woff2");font-weight:700;font-display:swap}
@font-face{font-family:"Avenir Next";src:url("fonts/Avenir-Next-Heavy.woff2") format("woff2");font-weight:800;font-display:swap}
@font-face{font-family:"Garamond Narrow";src:url("fonts/Garamond-Narrow-Regular.woff2") format("woff2");font-weight:400;font-display:swap}
:root{
  --bg:#0a0a0a;--glass:rgba(255,255,255,.12); --fg:#f2f2f2; --mut:#8a8a8a; --line:#1c1c1c; --accent:#f2f2f2;
  --head:"Avenir Next","Montserrat",system-ui,sans-serif;
  --body:"Avenir Next","Inter",system-ui,sans-serif;--ui:"Avenir Next","Inter",system-ui,sans-serif;--serif:"Garamond Narrow","Inter",system-ui,sans-serif;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
html{scroll-behavior:smooth;scroll-padding-top:110px;background:var(--bg)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:transparent;color:var(--fg);font:400 17px/1.55 var(--body);letter-spacing:-.02em;font-synthesis:none;-webkit-font-smoothing:antialiased;overflow-x:hidden}
/* Sem @media (prefers-reduced-motion): animacoes sempre ativas para todos. */

nav{position:fixed;top:env(safe-area-inset-top,0px);left:0;right:0;z-index:20;display:flex;align-items:center;gap:28px;padding:16px 28px;background:rgba(10,10,10,.5);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);border-bottom:1px solid rgba(255,255,255,.08)}
nav .logo{flex:none;display:block;color:#fff;line-height:0}nav .logo svg{height:24px;width:auto;display:block}
nav .links{display:flex;gap:26px;overflow-x:auto;scrollbar-width:none;flex:1}
nav .links::-webkit-scrollbar{display:none}
nav a{color:var(--mut);text-decoration:none;font:700 12px var(--head);letter-spacing:0;text-transform:uppercase;white-space:nowrap;padding:6px 0;border-bottom:2px solid transparent;transition:color .3s,border-color .3s}
nav a:hover{color:var(--fg)}
nav a.on{color:var(--accent);border-color:var(--accent)}
.store{flex:none;display:flex;align-items:center;gap:8px;font:700 11px var(--head);letter-spacing:0;text-transform:uppercase;color:var(--mut);cursor:pointer;background:var(--glass);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,.15);border-radius:99px;padding:9px 16px}
.store i{width:8px;height:8px;border-radius:50%;background:var(--line);transition:background .3s}
.store[aria-pressed=true]{color:var(--fg);border-color:#ffd23f}
.store[aria-pressed=true] i{background:#ffd23f}

.hero{min-height:100svh;display:grid;place-content:center;text-align:center;padding:120px 24px 80px;position:relative}
.hero p.k{font:500 13px var(--head);letter-spacing:.4em;color:var(--mut);margin:0 0 28px}
.hero .badge{justify-self:center;margin:0 0 28px;font:800 13px var(--head);letter-spacing:0;background:#fff;color:#111;padding:9px 20px;border-radius:99px}
.hero h1 .nw{white-space:nowrap}
.hero h1{font:800 clamp(44px,9vw,128px)/.95 var(--head);letter-spacing:-.03em;margin:0;text-transform:uppercase}
.hero p.s{font-family:var(--serif);letter-spacing:-.01em;font-size:23px;max-width:540px;margin:32px auto 40px;color:#b5b5b5}
.cta{display:inline-block;justify-self:center;font:700 12px var(--head);letter-spacing:0;text-transform:uppercase;color:#fff;background:var(--glass);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,.15);padding:18px 38px;text-decoration:none;border-radius:99px;transition:transform .3s,background .3s}
.cta:hover{transform:scale(1.05);background:rgba(255,255,255,.22)}

section{padding:120px 28px 40px;position:relative}
.sec-h{max-width:1180px;margin:0 auto 70px}
.sec-h h2{font:800 clamp(34px,6vw,76px)/1 var(--head);text-transform:uppercase;margin:0 0 14px;letter-spacing:-.03em}
.sec-h p{font-size:18px;margin:0;color:var(--mut);max-width:520px}
.chips{display:flex;gap:10px;flex-wrap:wrap;margin-top:24px}
.chips a{font:700 11px var(--head);letter-spacing:0;text-transform:uppercase;color:var(--fg);text-decoration:none;background:var(--glass);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.14);border-radius:99px;padding:9px 18px;transition:border-color .3s,color .3s}
.chips a:hover{border-color:var(--c);color:var(--c)}

.grp{margin:0 -28px 96px;scroll-margin-top:100px}
.gh{max-width:1180px;margin:0 auto 26px;display:flex;align-items:flex-end;justify-content:space-between;gap:24px}
.gh h3{font:800 clamp(24px,3.2vw,40px)/1.05 var(--head);text-transform:uppercase;margin:0;letter-spacing:-.03em;color:var(--fg)}
.grp.big .gh h3{font-size:clamp(34px,5.2vw,64px);color:var(--c)}
.gh p{margin:10px 0 0;color:#b5b5b5;max-width:520px;font-size:18px;line-height:1.55}
.gh .n{font:700 11px var(--head);color:var(--mut);text-transform:uppercase;margin-left:12px;white-space:nowrap;vertical-align:middle;letter-spacing:0}
.arrows{display:flex;gap:8px;flex:none}
.arrows button{width:44px;height:44px;border-radius:50%;background:var(--glass);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,.15);color:#fff;font-size:18px;cursor:pointer;transition:background .3s,opacity .3s}
.arrows button:hover{background:rgba(255,255,255,.24)}
.arrows button:disabled{opacity:.3;cursor:default}
.track{--pad:max(28px,calc((100vw - 1180px)/2));display:flex;gap:18px;overflow-x:auto;scroll-snap-type:x proximity;padding:4px var(--pad) 14px;scroll-padding-inline:var(--pad);scrollbar-width:none;overscroll-behavior-x:contain;cursor:grab;-webkit-overflow-scrolling:touch}
.track::-webkit-scrollbar{display:none}
.track.drag{cursor:grabbing;scroll-snap-type:none}
.track.drag *{pointer-events:none;user-select:none}
.pc{flex:0 0 clamp(224px,22vw,292px);scroll-snap-align:start;min-width:0}
.vis{aspect-ratio:4/5;border-radius:6px;position:relative;overflow:hidden;background:radial-gradient(120% 90% at 30% 20%,color-mix(in srgb,var(--c) 38%,#000) 0%,#0b0b0d 72%);border:1px solid rgba(255,255,255,.1);display:grid;place-items:center}
.vis::after{content:"";width:46%;aspect-ratio:2.1;border:2px solid var(--c);border-radius:50%;opacity:.5;box-shadow:0 0 50px color-mix(in srgb,var(--c) 40%,transparent)}
.vis.has::after{display:none}
.vis picture,.vis img{position:absolute;inset:0;width:100%;height:100%;display:block;object-fit:cover}
.vis img{opacity:0;transition:opacity .5s}.vis img.on{opacity:1}
.vis .cd{position:absolute;left:14px;bottom:12px;font:400 11px var(--ui);color:#6d6d6d;letter-spacing:0}
.vis.has .cd{display:none}
.tags{position:absolute;top:12px;left:12px;right:12px;display:flex;gap:6px;flex-wrap:wrap;z-index:2}
.tag{font:700 10.5px var(--head);letter-spacing:0;text-transform:uppercase;padding:6px 10px;border-radius:99px;background:rgba(0,0,0,.4);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border:1px solid var(--c);color:var(--c)}
.tag.soon{background:#fff;color:#111;border-color:#fff;font-weight:800}
.tag.loja{position:absolute;left:12px;bottom:12px;background:#ffd23f;color:#111;border-color:#ffd23f;font-weight:800;z-index:2}
.tag.soon,.tag.loja{-webkit-backdrop-filter:none;backdrop-filter:none}
.info{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:14px 2px 0}
.info b{font:700 16px/1.2 var(--head);display:block;letter-spacing:-.03em}
.info span{font-family:var(--ui);font-size:12px;color:var(--mut);letter-spacing:0}
.info .pr{font:700 17px var(--head);white-space:nowrap;letter-spacing:-.03em}
.info .pr.q{font-size:12px;color:var(--mut);font-weight:700}
.cores{display:flex;flex-wrap:wrap;gap:6px;padding:10px 2px 0}
.cores button,.cores i{font:700 11px var(--head);font-style:normal;letter-spacing:0;color:#cfcfcf;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);border-radius:99px;padding:5px 11px;cursor:pointer;transition:background .25s,border-color .25s,color .25s}
.cores i{cursor:default;background:none;border-color:transparent;padding-left:0;color:var(--mut);font-weight:400;font-size:12px}
.cores button:hover{border-color:rgba(255,255,255,.4)}
.cores button.on{background:#fff;color:#111;border-color:#fff}
.cores .ex{font:400 12px var(--ui);color:#ffd23f;padding:5px 0}

.lojas{max-width:1180px;margin:0 auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.loja{display:flex;flex-direction:column;gap:4px;padding:24px 22px 20px;border-radius:16px;background:var(--glass);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,.14)}
.loja .t{font:700 11px var(--head);letter-spacing:0;text-transform:uppercase;color:var(--mut)}
.loja h3{font:800 24px/1.05 var(--head);letter-spacing:-.03em;text-transform:uppercase;margin:2px 0 4px}
.loja .l{font:700 13px var(--head);color:#d6d6d6;letter-spacing:-.01em}
.loja address{font-style:normal;color:#b5b5b5;font-size:15px;line-height:1.45}
.loja .acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:auto;padding-top:18px}
.loja .acts a{display:inline-flex;align-items:center;min-height:44px;padding:0 16px;border-radius:99px;font:700 12px var(--head);letter-spacing:0;color:#fff;text-decoration:none;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.16);transition:background .3s,border-color .3s}
.loja .acts a:hover{background:rgba(255,255,255,.2);border-color:rgba(255,255,255,.4)}
.loja .acts a.tel{white-space:nowrap}
footer{text-align:center;padding:140px 24px 100px}
footer h2{font:800 clamp(30px,5vw,64px)/1.05 var(--head);text-transform:uppercase;margin:0 0 16px;letter-spacing:-.03em}
footer p{color:var(--mut);margin:0;font-size:17px}

#top{position:fixed;left:18px;bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:30;width:42px;height:42px;border-radius:50%;background:var(--glass);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,.15);color:var(--fg);cursor:pointer;font-size:16px}
body.only-store .pc:not([data-ex]){display:none}
body.only-store .chips{display:none}
.grp.vazio,section.vazio{display:none}

.burger{display:none;width:44px;height:44px;flex:none;border-radius:50%;background:var(--glass);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,.15);cursor:pointer;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:0}
.burger span{width:18px;height:2px;background:#fff;border-radius:2px;transition:transform .35s}
nav.open .burger span:first-child{transform:translateY(4px) rotate(45deg)}
nav.open .burger span:last-child{transform:translateY(-4px) rotate(-45deg)}
/* Fundo: video local (webm + mp4). O poster aparece enquanto carrega ou se o video nao tocar. */
#bg{position:fixed;inset:0;z-index:0;overflow:hidden;background:var(--bg)}
#bg video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
#veil{position:absolute;inset:0;background:#000;opacity:.5}
header,main,footer{position:relative;z-index:1}
/* Reserva: se as fontes locais falharem, entram Montserrat (titulos) e Inter (textos) com os tamanhos originais */
html.fb-head .hero h1,html.fb-head .sec-h h2,html.fb-head footer h2{font-weight:900}
html.fb-body .hero p.s{font-size:18px;font-weight:300;line-height:1.6}
@media(max-width:820px){
  .hero p.s{font-size:26px}
  .sec-h p{font-size:19px}
  .gh p{font-size:19px;line-height:1.5}
  footer p{font-size:18px}
  html.fb-body .hero p.s{font-size:19px}
  .hero h1{font-size:10.4vw}
  nav{padding:12px 16px;gap:10px;flex-wrap:nowrap}
  nav .logo{margin-right:auto}
  .burger{display:flex}
  nav .links{position:absolute;top:0;left:0;right:0;height:100svh;z-index:-1;flex:none;flex-direction:column;justify-content:center;align-items:flex-start;gap:4px;padding:90px 28px 40px;background:rgba(10,10,10,.96);overflow-y:auto;opacity:0;visibility:hidden;transform:translateY(-14px);transition:opacity .35s,transform .35s,visibility .35s}
  nav.open .links{opacity:1;visibility:visible;transform:none}
  nav .links a{font-size:clamp(26px,8.5vw,42px);font-weight:800;letter-spacing:-.03em;padding:10px 0;color:#fff;border-bottom:0}
  nav .links a.on{color:var(--accent)}
  .lojas{grid-template-columns:1fr}
  .arrows{display:none}
  .gh{padding:0 18px;margin-bottom:20px}
  .track{--pad:18px;gap:14px}
  .pc{flex-basis:62vw}
  .grp{margin:0 -18px 72px}
  section{padding:150px 18px 20px}
}
</style>
</head>
<body>
<div id="bg"><video id="vid" autoplay muted loop playsinline preload="auto"></video><div id="veil"></div></div>
<script>
/* Video de fundo local. Horizontal em tela larga, vertical em celular. WebM primeiro, MP4 como reserva (iOS/Safari antigo).
   Arquivos esperados em media/: bg-l.webm, bg-l.mp4, poster-l.jpg, bg-p.webm, bg-p.mp4, poster-p.jpg */
const vid=document.getElementById('vid');let cur='';
const saveData=!!(navigator.connection&&navigator.connection.saveData);
function setVid(){
  const k=innerHeight>innerWidth?'p':'l'; if(k===cur)return; cur=k;
  vid.poster='media/poster-'+k+'.jpg';
  if(saveData){vid.removeAttribute('autoplay');vid.pause();vid.innerHTML='';return}
  vid.innerHTML='<source src="media/bg-'+k+'.webm" type="video/webm"><source src="media/bg-'+k+'.mp4" type="video/mp4">';
  vid.load();vid.play&&vid.play().catch(()=>{});
}
let rt;addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(setVid,300)});
setVid();
</script>

90.5737 36.2094 85.4339 36.6144 79.4015 36.6144C73.537 36.6144 68.3584 36.3779 63.3624 35.881C53.2017 34.8708 42.5591 32.7407 34.5509 28.6779C32.5567 27.6666 30.6911 26.5619 29.0157 25.0764C27.425 23.6661 25.9081 21.9173 25.4806 19.508C24.762 15.4601 27.615 12.5158 29.9825 10.7043C32.5197 8.76257 35.7846 7.14012 38.919 5.96892C45.4339 3.53387 53.3124 1.91619 61.128 0.966972C66.3368 0.334455 70.959 0.00674803 77.0343 0.00017501ZM82.836 3.76872C81.2846 3.69165 79.2437 3.5441 77.3341 3.63493C77.3121 3.63611 77.2896 3.63493 77.2677 3.63493C70.219 3.63496 63.5249 4.91445 57.6603 7.0695C54.7882 8.12478 52.2357 9.42134 49.9903 11.3049C48.0311 12.9487 45.7146 15.5841 46.256 19.2072C46.7231 22.3325 49.2078 24.5625 51.3243 26.0441C53.6871 27.6977 56.5219 28.9477 59.3946 29.8781C65.6011 31.8886 72.554 32.7542 79.7355 32.6789C86.558 32.6073 93.7344 31.425 99.3761 29.2121C102.158 28.1207 104.827 26.7842 107.012 24.9435C109.024 23.2486 111.161 20.5103 110.614 17.1066C110.124 14.058 107.799 11.8288 105.545 10.2707C103.066 8.557 100.439 7.42882 97.4757 6.43571C92.9381 4.91521 87.782 4.01373 82.836 3.76872Z" fill="currentColor"/> </svg></a>

</nav>

<header class="hero" id="inicio" data-accent="#f2f2f2">
  <span class="badge" data-r>H2'26</span>
  <h1 data-r><span>Entregar</span><br><span class="nw">o inesperado.</span></h1>
  <p class="s" data-r>Cápsulas, performance, calçados, acessórios e peças importadas. A coleção H2'26 inteira, num lugar só.</p>
  <a class="cta" href="#capsulas" data-r>Ver a coleção</a>
</header>

<main id="app"></main>

<section id="lojas" data-accent="#f2f2f2" style="--c:#f2f2f2"><div class="sec-h"><h2 data-r>Lojas</h2><p data-r>Veja a coleção de perto. Endereços no estado de São Paulo.</p></div><div class="lojas" id="lojasGrid"></div></section>

<footer>
  <h2 data-r="in">Oakley H2'26.<br>Veja de perto na loja.</h2>
  </footer>

<button id="top" aria-label="Voltar ao topo">↑</button>

<script src="products.js"></script>
<script>try{FOTOS}catch(e){window.FOTOS={}}</script>
<script src="fotos.js" onerror="window.FOTOS=window.FOTOS||{}"></script>
<script>
const app=document.getElementById('app'),links=document.getElementById('links');
const esc=t=>String(t).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
const fotoUrl=(dir,c,v,ext)=>`img/${dir}/${c}${v?'_'+v:''}.${ext}`;
function card(g,it,sec){
  const c=g.cor||sec.cor,fs=(typeof FOTOS!=='undefined'&&FOTOS[it.c])||[];
  const main=fs.includes('')?'':(fs[0]||null);
  let tags='';
  if(g.soon)tags+='<span class="tag soon">Em breve</span>';
  if(it.novo)tags+='<span class="tag">Novo</span>';
  if(it.lim)tags+='<span class="tag">Edição limitada</span>';
  const loja=it.ex?`<span class="tag loja">Só em loja · ${esc(it.ex)}</span>`:'';
  const img=main===null?'':`<picture><source type="image/avif" srcset="${fotoUrl(g.dir,it.c,main,'avif')}"><img src="${fotoUrl(g.dir,it.c,main,'webp')}" alt="${esc(it.n)}" loading="lazy" decoding="async" width="800" height="1000"></picture>`;
  const cs=it.cores||[];
  const cl=(cs.length>1?cs.map((k,n)=>`<button type="button" data-k="${k.k}" class="${n?'':'on'}">${esc(k.n)}</button>`).join(''):cs.length===1?`<i>${esc(cs[0].n)}</i>`:'')+(it.exc?`<span class="ex">Só em loja na cor ${esc(it.exc)}</span>`:'');
  const cores=cl?`<div class="cores">${cl}</div>`:'';
  const preco=it.p?`<div class="pr">R$ ${it.p}</div>`:`<div class="pr q">Consulte na loja</div>`;
  return `<article class="pc" data-c="${it.c}" ${it.ex?'data-ex':''}><div class="vis${img?' has':''}">${img}<div class="tags">${tags}</div>${loja}<span class="cd">${it.c}</span></div><div class="info"><div><b>${esc(it.n)}</b><span>${it.c}${it.f?' · '+it.f:''}</span></div>${preco}</div>${cores}</article>`;
}
let h='';
CATALOGO.forEach(s=>{
  links.insertAdjacentHTML('beforeend',`<a href="#${s.id}" data-a="${s.cor}">${s.nome}</a>`);
  h+=`<section id="${s.id}" data-accent="${s.cor}" style="--c:${s.cor}"><div class="sec-h"><h2 data-r>${s.nome}</h2><p data-r>${s.desc}</p>`;
  if(s.grupos.length>1)h+=`<div class="chips" data-r>${s.grupos.map(g=>`<a href="#${g.grupo.id}" style="--c:${g.grupo.cor||s.cor}">${esc(g.grupo.nome)}</a>`).join('')}</div>`;
  h+='</div>';
  s.grupos.forEach(({grupo:g,itens})=>{
    const c=g.cor||s.cor;
    h+=`<div class="grp${g.big?' big':''}" id="${g.id}" data-accent="${c}" style="--c:${c}"><div class="gh" data-r><div><h3>${esc(g.nome)}<span class="n">${itens.length} ${itens.length>1?'produtos':'produto'}</span></h3>${g.desc?`<p>${esc(g.desc)}</p>`:''}</div><div class="arrows"><button type="button" class="pv" aria-label="Anterior">←</button><button type="button" class="nx" aria-label="Próximo">→</button></div></div><div class="track" data-r>${itens.map(it=>card(g,it,s)).join('')}</div></div>`;
  });
  h+='</section>';
});
app.innerHTML=h;

/* Carrosséis: setas, arrastar com o mouse, e troca de foto por cor */
document.querySelectorAll('.grp').forEach(gp=>{
  const tr=gp.querySelector('.track'),pv=gp.querySelector('.pv'),nx=gp.querySelector('.nx');
  const upd=()=>{pv.disabled=tr.scrollLeft<8;nx.disabled=tr.scrollLeft+tr.clientWidth>=tr.scrollWidth-8};
  const go=d=>tr.scrollBy({left:d*tr.clientWidth*.8,behavior:'smooth'});
  pv.onclick=()=>go(-1);nx.onclick=()=>go(1);tr.addEventListener('scroll',upd,{passive:true});addEventListener('resize',upd);upd();
  let down=null,moved=0;
  tr.addEventListener('pointerdown',e=>{if(e.pointerType!=='mouse'||e.button!==0)return;down={x:e.clientX,l:tr.scrollLeft};moved=0});
  addEventListener('pointermove',e=>{if(!down)return;const dx=e.clientX-down.x;if(Math.abs(dx)>5){moved=1;tr.classList.add('drag')}if(moved)tr.scrollLeft=down.l-dx});
  addEventListener('pointerup',()=>{if(down){down=null;tr.classList.remove('drag');upd()}});
});
const byCode={};CATALOGO.forEach(s=>s.grupos.forEach(({grupo:g,itens})=>itens.forEach(i=>byCode[i.c]={g,i})));
app.addEventListener('click',e=>{
  const b=e.target.closest('.cores button');if(!b)return;
  const pc=b.closest('.pc'),{g,i}=byCode[pc.dataset.c],k=b.dataset.k,fs=(typeof FOTOS!=='undefined'&&FOTOS[i.c])||[];
  pc.querySelectorAll('.cores button').forEach(x=>x.classList.toggle('on',x===b));
  const v=fs.includes(k)?k:(fs.includes('')?'':null);if(v===null)return;
  const im=pc.querySelector('img'),so=pc.querySelector('source');if(!im)return;
  im.classList.remove('on');so.srcset=fotoUrl(g.dir,i.c,v,'avif');im.src=fotoUrl(g.dir,i.c,v,'webp');
});
/* Foto carregada: fade-in. Foto que falhar: volta ao placeholder. */
document.querySelectorAll('.vis img').forEach(im=>{
  const ok=()=>im.classList.add('on'),bad=()=>{const v=im.closest('.vis');v.classList.remove('has');im.closest('picture').remove()};
  im.addEventListener('load',ok);im.addEventListener('error',bad);if(im.complete)(im.naturalWidth?ok():bad());
});
app.addEventListener('load',e=>{if(e.target.matches&&e.target.matches('.vis img'))e.target.classList.add('on')},true);

const LOJAS=[
 {t:"O Store",n:"Dom Pedro",l:"Parque D. Pedro Shopping",a:"Av. Guilherme Campos, 500",c:"Campinas, SP",tel:"(19) 99211-4159"},
 {t:"O Store",n:"Morumbi",l:"MorumbiShopping",a:"Av. Roque Petroni Júnior, 1089",c:"São Paulo, SP",tel:"(11) 5189-4805"},
 {t:"O Store",n:"Anália Franco",l:"Shopping Anália Franco",a:"Av. Regente Feijó, 1739",c:"São Paulo, SP",tel:"(11) 94261-0634"},
 {t:"O Vault",n:"Catarina",l:"Catarina Fashion Outlet",a:"Rod. Castello Branco, km 60",c:"São Roque, SP",tel:"(11) 4130-4800",nt:"Central"},
 {t:"O Store",n:"Center Norte",l:"Shopping Center Norte",a:"Travessa Casalbuono, 120",c:"São Paulo, SP",tel:"(11) 2226-0400",nt:"Central"},
 {t:"O Vault",n:"Itupeva",l:"Outlet Premium",a:"Rod. dos Bandeirantes, km 72",c:"Itupeva, SP",tel:"(11) 96413-6062"},
 {t:"O Store",n:"Eldorado",l:"Shopping Eldorado",a:"Av. Rebouças, 3970",c:"São Paulo, SP",tel:"(11) 99223-7297"},
 {t:"Outlet Premium",n:"Imigrantes",l:"",a:"Rod. dos Imigrantes, km 43",c:"São Bernardo do Campo, SP",tel:"(11) 91766-5213"}
];
document.getElementById('lojasGrid').innerHTML=LOJAS.map(o=>{
  const q=encodeURIComponent('Oakley '+o.n+', '+o.a+', '+o.c);
  const d='+55'+o.tel.replace(/\D/g,'');
  return `<div class="loja" data-r><span class="t">${o.t}</span><h3>${o.n}</h3>${o.l?`<span class="l">${o.l}</span>`:''}<address>${o.a}<br>${o.c}</address><div class="acts"><a class="tel" href="tel:${d}">${o.tel}${o.nt?' · '+o.nt:''}</a><a href="https://www.google.com/maps/search/?api=1&query=${q}" target="_blank" rel="noopener">Como chegar</a></div></div>`;
}).join('');
links.insertAdjacentHTML('beforeend','<a href="#lojas" data-a="#f2f2f2">Lojas</a>');

/* --- Scroll: fade + blur entrando E saindo. Independe de prefers-reduced-motion. --- */
const els=[...document.querySelectorAll('[data-r]')];
let tick=false;
const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
function paint(){
  tick=false;
  const vh=innerHeight;
  document.getElementById('veil').style.opacity=(.5+.38*clamp(scrollY/(vh*.9),0,1)).toFixed(3);
  els.forEach(e=>{
    const r=e.getBoundingClientRect();
    if(e.dataset.r==='in'){const end=scrollY+vh>=document.documentElement.scrollHeight-6;const q=end?1:clamp((vh-40-r.top)/120,0,1);e.style.opacity=q;e.style.filter=`blur(${((1-q)*14).toFixed(1)}px)`;e.style.transform=`translate3d(0,${((1-q)*50).toFixed(1)}px,0)`;return}
    if(r.bottom<-200||r.top>vh+200){e.style.opacity=0;return}
    const cy=r.top+r.height/2;let s,dir=cy>vh/2?1:-1;
    if(r.height>vh*.42){/* elemento alto (carrossel): some so quando sai de verdade, pelas bordas */
      const a=clamp((vh*.94-r.top)/(vh*.28),0,1),z=clamp((r.bottom-vh*.06)/(vh*.28),0,1),v=Math.min(a,z);
      s=v*v*(3-2*v);dir=a<z?1:-1;
    }else{const d=Math.abs(cy-vh/2)/(vh/2),v=1-clamp((d-.55)/.5,0,1);s=v*v*(3-2*v)}
    e.style.opacity=s.toFixed(3);
    e.style.filter=`blur(${((1-s)*14).toFixed(1)}px)`;
    e.style.transform=`translate3d(0,${(dir*(1-s)*50).toFixed(1)}px,0) scale(${(.96+.04*s).toFixed(3)})`;
    e.style.willChange='opacity,filter,transform';
  });
  spy();
}
function spy(){
  const y=innerHeight*.4;let cur=null;
  document.querySelectorAll('[data-accent]').forEach(s=>{const r=s.getBoundingClientRect();if(r.top<=y&&r.bottom>y)cur=s});
  if(cur)document.documentElement.style.setProperty('--accent',cur.dataset.accent);
  const sec=[...document.querySelectorAll('section')].find(s=>{const r=s.getBoundingClientRect();return r.top<=y&&r.bottom>y});
  links.querySelectorAll('a').forEach(a=>a.classList.toggle('on',!!sec&&a.getAttribute('href')==='#'+sec.id));
}
const req=()=>{if(!tick){tick=true;requestAnimationFrame(paint)}};
addEventListener('scroll',req,{passive:true});addEventListener('resize',req);

function filtra(on){
  document.querySelectorAll('.grp').forEach(g=>g.classList.toggle('vazio',on&&!g.querySelector('.pc[data-ex]')));
  document.querySelectorAll('#app section').forEach(sc=>sc.classList.toggle('vazio',on&&!sc.querySelector('.pc[data-ex]')));
  links.querySelectorAll('a').forEach(a=>{const sc=document.getElementById(a.getAttribute('href').slice(1));a.style.display=(sc&&sc.classList.contains('vazio'))?'none':''});
  document.querySelectorAll('.track').forEach(t=>t.scrollLeft=0);
}
const st=document.getElementById('store');
st.onclick=()=>{const v=st.getAttribute('aria-pressed')!=='true';st.setAttribute('aria-pressed',v);document.body.classList.toggle('only-store',v);filtra(v);setTimeout(req,50)};
/* Detecta falha das fontes proprias e carrega Montserrat/Inter so nesse caso */
(function(){
  const H=document.documentElement;let gf=0;
  function g(){if(gf)return;gf=1;const l=document.createElement('link');l.rel='stylesheet';l.href='https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=Montserrat:wght@700;800;900&display=swap';document.head.appendChild(l)}
  const t=(spec,cls)=>document.fonts.load(spec).then(r=>{if(!r.length){H.classList.add(cls);g()}}).catch(()=>{H.classList.add(cls);g()});
  t('800 20px "Avenir Next"','fb-head');t('400 20px "Garamond Narrow"','fb-body');
})();
const nv=document.querySelector('nav'),bg=document.getElementById('burger');
function menu(o){nv.classList.toggle('open',o);bg.setAttribute('aria-expanded',o);bg.setAttribute('aria-label',o?'Fechar menu':'Abrir menu');document.body.style.overflow=o?'hidden':''}
bg.onclick=()=>menu(!nv.classList.contains('open'));
links.addEventListener('click',e=>{if(e.target.closest('a'))menu(false)});
addEventListener('keydown',e=>{if(e.key==='Escape')menu(false)});
addEventListener('resize',()=>{if(innerWidth>820)menu(false)});
document.getElementById('top').onclick=()=>scrollTo({top:0,behavior:'smooth'});
paint();
</script>
</body>
